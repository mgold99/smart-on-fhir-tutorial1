        function urlParam(p) {
          var query = location.search.substr(1);
          var data = query.split("&");
          var result = [];
          for (var i = 0; i < data.length; i++) {
            var item = data[i].split("=");
            if (item[0] === p) {
              var res = item[1].replace(/\+/g, "%20");
              result.push(decodeURIComponent(res));
            }
          }
        
          if (result.length === 0) {
            return null;
          }
          return result[0];
        }
        
        var serverSettings = {};
        
        //var iss = urlParam("iss");
        var iss = 'https://interopio.ontada.com/gateway/fhir/developerportalio/portal/gw-fhir';      
        //var clientId = urlParam("clientid");
        var clientId = '14de6c9f-0e2b-4043-9dbd-5eb5581c6112';
        //var scope = urlParam("scope");
        var scope = ['patient/Patient.read', 'patient/Observation.read', 'launch', 'launch/patient', 'openid', 'fhirUser'].join(" ")
        var secret = urlParam("secret");
        
        if (scope) {
          scope = decodeURIComponent(scope);
        }
        
        var result = {
          client_id: clientId,
          scope: scope || "fhirUser openid",
          completeInTarget: true,
        };
        
       /* if (secret) {

      FHIR.oauth2.settings.fullSessionStorageSupport = false;
      console.log(result);
      FHIR.oauth2.authorize(result);
    </script>
