<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>Static Template</title>
        <link rel="stylesheet" href="style1.css">
        <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>
        <script src="app1.js"></script>
    </head>
    <body>
        <div class="cell top-left">
            <h4>Current Patient</h4>
            <pre id="patient"></pre>
        </div>
        <div class="cell top-center">
            <h4>Current User</h4>
            <pre id="user"></pre>
        </div>
        <div class="cell top-right">
            <h4>Current Encounter</h4>
            <pre id="encounter"></pre>
        </div>
        <div class="cell bottom">
            <h4>Main Output</h4>
            <pre id="output">Loading...</pre>
        </div>
        <script type="text/javascript">
            window.FHIR.oauth2.settings.fullSessionStorageSupport = false;
            FHIR.oauth2.ready().then(function(client) {
                
            try {
                smartState = JSON.parse(sessionStorage.getItem(params.get("state")));
                console.log("STATE");
                console.log(smartState);
                const idToken = jwtDecode(smartState.tokenResponse.id_token);
                window.idToken = idToken;
              } catch (error) {
                console.error("SMART ERROR...", error);
              }

                var app = new App(client);
                app.renderContext();
                app.request("metadata");
            }).catch(createRenderer("output"));
        </script>
    </body>
</html>
